server {
    listen 80;
    server_name my12306.tianminglalala.top;

    # 前台静态资源及页面代理
    location / {
        proxy_pass http://12306-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前台 API 接口代理
    location /api/ {
        proxy_pass http://12306-gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源缓存优化
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        proxy_pass http://12306-frontend:80;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
server {
    listen 80;
    server_name admin.tianminglalala.top; # 替换为您的后台域名

    # 后台静态资源及页面代理
    location / {
        proxy_pass http://12306-admin-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后台 API 接口代理
    location /api/ {
        proxy_pass http://12306-gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nacos 控制台代理
    location /nacos/ {
        proxy_pass http://12306-nacos:8848/nacos/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后台静态资源缓存优化
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        proxy_pass http://12306-admin-frontend:80;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
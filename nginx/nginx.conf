# HTTP 重定向
server {
    listen 80;
    server_name my12306.tianminglalala.top admin.tianminglalala.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name my12306.tianminglalala.top;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    # 前台静态资源及页面代理
    location / {
        proxy_pass http://12306-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前台 API 接口代理
    location /api/ {
        proxy_pass http://12306-gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源缓存优化
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        proxy_pass http://12306-frontend:80;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /your-secret-path {
        proxy_pass http://127.0.0.1:10000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
server {
    listen 443 ssl;
    server_name admin.tianminglalala.top;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # 后台静态资源及页面代理
    location / {
        proxy_pass http://12306-admin-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后台 API 接口代理
    location /api/ {
        proxy_pass http://12306-gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nacos 控制台代理
    location /nacos/ {
        proxy_pass http://12306-nacos:8848/nacos/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后台静态资源缓存优化
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        proxy_pass http://12306-admin-frontend:80;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}